# GLAW public intake app — dashboard + routing interview + intake capture API.
# public/atlas.html is a copy of ../lib/intake-atlas.html — the dashboard/SKILL.md
# sync rule applies: roster/intake changes update both copies in the same change.
name = "glaw-intake"
main = "src/worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "INTAKE_KV"
id = "879f3d111bbb4957a670b9039105c114"

# Set LEGAL_API_TOKEN (single tenant) or LEGAL_TENANT_TOKENS (multi-tenant JSON)
# as an encrypted Worker secret before enabling /legal/*.
# The legal workflow uses this KV namespace with legal:request: and
# legal:audit: prefixes; audit rows are append-only and independently keyed.
